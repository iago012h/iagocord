<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iagocord - Premium Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --discord-darkest: #111214;
      --discord-sidebar: #1e1f22;
      --discord-main: #2b2d31;
      --discord-blurple: #5865f2;
      --discord-green: #23a55a;
      --discord-red: #da373a;
      --neon-gamer: #b05cff;
    }
    
    body {
      background-color: var(--discord-main);
      color: #dbdee1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .bg-grid-pattern {
      background-image: 
        linear-gradient(to right, #1e1f22 1px, transparent 1px),
        linear-gradient(to bottom, #1e1f22 1px, transparent 1px);
      background-size: 40px 40px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #111214; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #5865f2; }

    .speaking {
      border: 3px solid var(--discord-green) !important;
      box-shadow: 0 0 20px rgba(35, 165, 90, 0.4);
      transform: scale(1.01);
      transition: all 0.2s ease-out;
    }
    
    .video-card {
      transition: all 0.3s ease;
      background: linear-gradient(145deg, #1e1f22, #2b2d31);
    }
    .video-card:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #videos-grid.has-pinned {
      align-content: start;
    }
    
    .video-pinned {
      grid-column: 1 / -1 !important;
      height: 70vh !important;
      min-height: 400px !important;
      z-index: 10;
    }

    #videos-grid.has-pinned .video-card:not(.video-pinned) {
      height: 180px !important;
      min-height: 180px !important;
    }

    .video-card:fullscreen {
      border: none !important;
      border-radius: 0 !important;
      background: #000 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    
    .video-card:fullscreen video {
      object-fit: contain !important;
      background: #000 !important;
    }

    .video-card:-webkit-full-screen {
      border: none !important;
      border-radius: 0 !important;
      background: #000 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    
    .video-card:-webkit-full-screen video {
      object-fit: contain !important;
      background: #000 !important;
    }
    
    .glow-hover:hover {
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.6);
    }
    .glow-gamer:hover {
      box-shadow: 0 0 20px rgba(176, 92, 255, 0.8);
    }
  </style>
</head>
<body class="h-screen flex overflow-hidden select-none bg-grid-pattern">

  <!-- 1. Barra Lateral de Servidores -->
  <aside class="w-[72px] bg-[var(--discord-darkest)] flex flex-col items-center py-4 gap-3 flex-shrink-0 z-20 hidden md:flex shadow-2xl">
    <div class="w-12 h-12 bg-gradient-to-br from-[#5865f2] to-[#7983f5] rounded-2xl flex items-center justify-center text-white font-bold text-2xl cursor-pointer hover:rounded-xl hover:scale-105 transition-all shadow-[0_0_15px_rgba(88,101,242,0.5)]">
      <i>i</i>
    </div>
    <div class="w-8 h-[2px] bg-[#35363c] rounded my-1"></div>
    <div id="btn-reload" title="Recarregar Chamada" class="w-12 h-12 bg-[#2b2d31] hover:bg-[#23a55a] text-[#23a55a] hover:text-white rounded-full hover:rounded-2xl flex items-center justify-center cursor-pointer transition-all">
      <i data-lucide="refresh-cw" class="w-5 h-5"></i>
    </div>
  </aside>

  <!-- 2. Barra de Canais -->
  <aside id="sidebar-channels" class="w-full md:w-64 bg-[var(--discord-sidebar)] flex flex-col justify-between flex-shrink-0 border-r border-[#111214] absolute md:relative z-10 h-full transition-transform duration-300">
    <div>
      <div class="h-14 px-4 flex items-center justify-between font-extrabold text-white shadow-md bg-gradient-to-r from-[#1e1f22] to-[#2b2d31]">
        <span class="truncate tracking-wide">IAGOCORD PREMIUM</span>
        <button id="btn-close-sidebar" class="md:hidden p-1 hover:bg-[#35373c] rounded text-gray-400">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-3 space-y-2 mt-2">
        <div class="text-[11px] font-bold text-[#949ba4] px-2 tracking-widest uppercase">Servidor Atual</div>
        <div class="flex items-center gap-2 px-2 py-2 rounded bg-gradient-to-r from-[#35373c] to-transparent text-white cursor-pointer border-l-2 border-[#5865f2]">
          <i data-lucide="server" class="w-4 h-4 text-gray-300"></i>
          <span class="text-sm font-semibold truncate" id="channel-name-display">--</span>
          <span id="badge-status" class="ml-auto text-[9px] bg-yellow-500 text-black px-2 py-0.5 rounded-full font-bold shadow-[0_0_5px_#eab308]">CONECTANDO</span>
        </div>
      </div>
    </div>

    <!-- Perfil Inferior -->
    <div class="h-16 bg-[#111214] px-3 flex items-center justify-between shadow-[0_-5px_10px_rgba(0,0,0,0.2)]">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="relative flex-shrink-0">
          <img id="avatar-img-preview" src="" class="w-9 h-9 rounded-full hidden object-cover border-2 border-[#2b2d31]" />
          <div id="avatar-initial-container" class="w-9 h-9 rounded-full bg-gradient-to-br from-[#5865f2] to-[#3f49b5] flex items-center justify-center text-white font-bold text-sm shadow-md">
            <span id="avatar-initial">U</span>
          </div>
          <div id="status-indicator-dot" class="w-3.5 h-3.5 bg-yellow-500 rounded-full border-2 border-[#111214] absolute -bottom-0.5 -right-0.5 transition-colors"></div>
        </div>
        <div class="leading-tight overflow-hidden">
          <div id="display-username" class="text-sm font-bold text-white truncate w-24">Você</div>
          <div id="display-status-text" class="text-[11px] text-yellow-500 font-medium truncate">Aguardando entrada</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 3. Área Principal -->
  <main class="flex-1 flex flex-col relative overflow-hidden w-full bg-transparent">
    <!-- Topbar -->
    <header class="h-14 border-b border-[#1e1f22] px-3 md:px-5 flex items-center justify-between bg-[var(--discord-main)]/90 backdrop-blur-sm shadow-sm shrink-0 z-10">
      <div class="flex items-center gap-3 min-w-0">
        <button id="btn-open-sidebar" class="md:hidden p-1.5 hover:bg-[#35373c] rounded text-gray-400 shrink-0">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <div class="p-1.5 bg-[#1e1f22] rounded-lg hidden md:block shrink-0">
            <i data-lucide="hash" class="w-5 h-5 text-gray-400"></i>
        </div>
        <span class="font-bold text-white text-[15px] truncate" id="room-title">Canal: Carregando...</span>
      </div>
      <div class="flex gap-3 shrink-0 ml-2">
          <button id="btn-toggle-chat" class="flex items-center justify-center px-3 py-1.5 bg-[#1e1f22] hover:bg-[#35373c] text-white text-xs font-bold rounded-lg transition shadow-md">
              <i data-lucide="message-square" class="w-4 h-4 md:mr-1.5 text-[#5865f2]"></i>
              <span class="hidden md:inline">Chat</span>
          </button>
          <button id="btn-copy-link" class="flex items-center justify-center px-3 py-1.5 bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold rounded-lg transition shadow-md glow-hover">
            <i data-lucide="user-plus" class="w-4 h-4 md:mr-1.5"></i>
            <span class="hidden md:inline">Copiar Convite</span>
          </button>
      </div>
    </header>

    <!-- Modal Inicial -->
    <div id="join-modal" class="absolute inset-0 bg-black/80 backdrop-blur-lg z-40 flex items-center justify-center p-4 overflow-y-auto">
      <div class="bg-[var(--discord-main)] border border-[#1e1f22] w-full max-w-md p-6 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.5)] text-center flex flex-col my-auto">
        
        <!-- Tabs -->
        <div class="flex bg-[#1e1f22] rounded-lg p-1 mb-6">
           <button id="tab-join" class="flex-1 py-2 text-sm font-bold text-white bg-[#5865f2] rounded-md transition-all shadow">Entrar no Servidor</button>
           <button id="tab-create" class="flex-1 py-2 text-sm font-bold text-[#949ba4] hover:text-white transition-all">Criar Servidor</button>
        </div>

        <div class="w-16 h-16 bg-gradient-to-br from-[#5865f2] to-[#7983f5] rounded-3xl mx-auto flex items-center justify-center text-white mb-4 shadow-[0_0_20px_rgba(88,101,242,0.4)] transform -rotate-6 shrink-0">
          <i data-lucide="headset" class="w-8 h-8"></i>
        </div>
        <h2 id="modal-title" class="text-2xl font-extrabold text-white mb-1">Entrar no QG</h2>
        <p id="modal-desc" class="text-sm text-[#949ba4] mb-6 font-medium">Use o Token de convite para conectar à call.</p>

        <div class="space-y-4 text-left">
          <div>
            <label class="text-xs font-bold text-[#b5bac1] uppercase tracking-wider block mb-1.5">Seu Nickname *</label>
            <input id="input-username" type="text" placeholder="Ex: Iago" class="w-full bg-[#1e1f22] border-2 border-[#111214] text-white rounded-lg p-3 text-sm focus:outline-none focus:border-[#5865f2] transition-colors" />
          </div>
          <div>
            <label class="text-xs font-bold text-[#b5bac1] uppercase tracking-wider block mb-1.5">URL do Avatar (Opcional)</label>
            <input id="input-avatar" type="text" placeholder="Link da imagem..." class="w-full bg-[#1e1f22] border-2 border-[#111214] text-white rounded-lg p-3 text-sm focus:outline-none focus:border-[#5865f2] transition-colors" />
          </div>
          
          <div id="box-token">
            <label class="text-xs font-bold text-[#b5bac1] uppercase tracking-wider block mb-1.5 flex justify-between">
              <span>Token do Servidor *</span>
              <span class="text-[10px] text-[#5865f2] font-normal lowercase bg-[#5865f2]/10 px-2 py-0.5 rounded">Requerido</span>
            </label>
            <input id="input-room" type="text" placeholder="Ex: A7X9-B2K1" class="w-full bg-[#1e1f22] border-2 border-[#111214] text-[#23a55a] font-bold rounded-lg p-3 text-sm focus:outline-none focus:border-[#5865f2] transition-colors uppercase tracking-widest text-center" />
          </div>

          <div id="box-create" class="hidden">
            <label class="text-xs font-bold text-[#b5bac1] uppercase tracking-wider block mb-1.5">Nome do Novo Servidor *</label>
            <input id="input-new-room" type="text" placeholder="Ex: Resenha de Sábado" class="w-full bg-[#1e1f22] border-2 border-[#111214] text-white rounded-lg p-3 text-sm focus:outline-none focus:border-[#23a55a] transition-colors" />
          </div>

          <button id="btn-action" class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold py-3.5 rounded-lg text-sm transition-all mt-6 shadow-lg glow-hover scale-100 hover:scale-[1.02]">
            Conectar à Call
          </button>
        </div>
      </div>
    </div>

    <!-- Área de Conteúdo (Vídeos + Chat) -->
    <div class="flex-1 flex overflow-hidden w-full relative">
        <!-- Grid dos Vídeos -->
        <div id="videos-grid" class="flex-1 p-3 md:p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 overflow-y-auto auto-rows-fr transition-all duration-300">
          <!-- Cards de vídeo inseridos dinamicamente -->
        </div>

        <!-- Chat Lateral -->
        <aside id="chat-panel" class="w-full sm:w-80 bg-[var(--discord-sidebar)] border-l border-[#111214] flex flex-col h-full transform translate-x-full transition-transform duration-300 absolute right-0 z-20 sm:relative sm:translate-x-0 hidden shadow-2xl">
            <div class="h-14 border-b border-[#111214] px-4 flex items-center justify-between shrink-0 bg-[#2b2d31]">
                <div class="flex items-center gap-2 text-white font-bold text-sm tracking-wide">
                    <i data-lucide="hash" class="w-5 h-5 text-[#949ba4]"></i>
                    bate-papo
                </div>
                <button id="btn-close-chat" class="p-1.5 hover:bg-[#35373c] rounded-md text-gray-400 sm:hidden transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-5 scroll-smooth">
                <div class="text-center bg-[#1e1f22] p-4 rounded-xl border border-[#35373c] mt-2">
                    <h3 class="text-white font-bold text-sm mb-1">Bem-vindo ao Servidor!</h3>
                    <p class="text-xs text-gray-400">Este chat agora é salvo na nuvem pelo Firebase.</p>
                </div>
            </div>

            <div class="p-4 bg-[#2b2d31] shrink-0 border-t border-[#1e1f22]">
                <div class="relative bg-[#383a40] rounded-xl p-1 flex items-center shadow-inner border border-transparent focus-within:border-[#5865f2] transition-colors">
                    <input id="chat-input" type="text" placeholder="Conversar na sala..." class="flex-1 bg-transparent border-none text-sm text-white focus:outline-none px-3 py-2 placeholder-[#949ba4]" />
                    <button id="btn-send-msg" class="p-2 text-[#5865f2] hover:text-[#7983f5] transition bg-[#2b2d31] rounded-lg shadow-sm mr-1">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Barra de Controles Inferior -->
    <footer class="h-24 bg-[var(--discord-darkest)] flex flex-col md:flex-row items-center justify-center md:justify-between px-6 shrink-0 z-10 relative border-t border-[#1e1f22]">
      
      <div class="hidden md:flex w-1/3 items-center text-[#949ba4] text-xs font-semibold gap-2">
        <i data-lucide="shield-check" class="w-4 h-4 text-[#23a55a]"></i>
        Firebase + WebRTC
      </div>

      <!-- Controles Centrais -->
      <div class="flex items-center gap-3 md:gap-5 w-full md:w-1/3 justify-center">
        <button id="ctrl-mic" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#2b2d31] hover:bg-[#35373c] text-white flex items-center justify-center transition-all shadow-lg hover:shadow-xl group">
          <i data-lucide="mic" id="main-mic-icon" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>
        <button id="ctrl-cam" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#2b2d31] hover:bg-[#35373c] text-white flex items-center justify-center transition-all shadow-lg hover:shadow-xl group">
          <i data-lucide="video" id="main-video-icon" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>
        <button id="ctrl-screen" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#2b2d31] hover:bg-[#5865f2] text-white hidden sm:flex items-center justify-center transition-all shadow-lg hover:shadow-xl group" title="Compartilhar Tela (Básico)">
          <i data-lucide="monitor-up" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>
        <button id="ctrl-gamer" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-gradient-to-br from-[#8a2be2] to-[#b05cff] text-white hidden sm:flex items-center justify-center transition-all shadow-[0_0_15px_rgba(176,92,255,0.4)] glow-gamer group" title="Modo Gamer (60 FPS + Áudio Puro)">
          <i data-lucide="gamepad-2" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>
        <div class="w-px h-8 bg-[#35373c] mx-1"></div>
        <button id="ctrl-leave" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#da373a] hover:bg-[#c92b2d] text-white flex items-center justify-center transition-all shadow-[0_0_15px_rgba(218,55,58,0.4)] group">
          <i data-lucide="phone-off" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>
      </div>

      <div class="hidden md:flex w-1/3 justify-end text-[#949ba4] text-xs font-bold items-center gap-2">
        Online e Seguro
        <i data-lucide="zap" class="w-4 h-4 text-[#eebb19]"></i>
      </div>
    </footer>
  </main>

  <!-- FIREBASE CONFIG AND SCRIPT LOGIC -->
  <script type="module">
    // Importações do Firebase SDK via CDN (ES Modules)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Configuração do Firebase fornecida pelo usuário
    const firebaseConfig = {
      apiKey: "AIzaSyA4jp-qlPxC5BNkSGEdRKm6kSDVvov3kjs",
      authDomain: "lead-d586a.firebaseapp.com",
      projectId: "lead-d586a",
      storageBucket: "lead-d586a.firebasestorage.app",
      messagingSenderId: "417403674811",
      appId: "1:417403674811:web:3565f5fc391b9e7108499e",
      measurementId: "G-RBCX7LPLL3"
    };

    // Inicialização
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();

    // =========================
    // Estado da aplicação
    // =========================
    let localStream = null;
    let activeStream = null;
    let screenStream = null;
    let peer = null;
    let mqttClient = null;
    let currentRoomToken = null; // Agora a sala é o Token!
    let currentRoomName = null;
    let myPeerId = null;
    let myProfile = { name: 'Usuário', avatar: null };
    const calls = {};
    const remoteProfiles = {}; 
    const activeScreenShares = new Set(); 
    let isSharing = false;
    let isMuted = false;
    let isVideoOff = false;
    let mqttConnected = false;

    // Utilitário global para o HTML
    document.getElementById('btn-reload').onclick = () => location.reload();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('room')) {
      document.getElementById('input-room').value = urlParams.get('room');
    }

    // =========================
    // Sidebar / Chat Toggle
    // =========================
    const sidebarChannels = document.getElementById('sidebar-channels');
    document.getElementById('btn-open-sidebar').addEventListener('click', () => {
      sidebarChannels.classList.remove('-translate-x-full');
      sidebarChannels.classList.add('translate-x-0', 'absolute');
    });
    document.getElementById('btn-close-sidebar').addEventListener('click', () => {
      sidebarChannels.classList.add('-translate-x-full');
      sidebarChannels.classList.remove('translate-x-0');
    });
    if (window.innerWidth < 768) {
      sidebarChannels.classList.add('-translate-x-full');
    }

    const chatPanel = document.getElementById('chat-panel');
    let isChatOpen = false;

    function toggleChat() {
      isChatOpen = !isChatOpen;
      if (isChatOpen) {
        chatPanel.classList.remove('hidden');
        setTimeout(() => chatPanel.classList.remove('translate-x-full'), 10);
      } else {
        chatPanel.classList.add('translate-x-full');
        setTimeout(() => chatPanel.classList.add('hidden'), 300);
      }
    }

    document.getElementById('btn-toggle-chat').addEventListener('click', toggleChat);
    document.getElementById('btn-close-chat').addEventListener('click', toggleChat);

    // =========================
    // Utilidades UI
    // =========================
    function setStatus(text, color = 'yellow') {
      const badge = document.getElementById('badge-status');
      const dot = document.getElementById('status-indicator-dot');
      const statusText = document.getElementById('display-status-text');

      const colors = { yellow: '#eab308', green: '#23a55a', red: '#da373a' };

      badge.innerText = text;
      badge.style.backgroundColor = colors[color] || colors.yellow;
      badge.style.color = color === 'yellow' ? '#000' : '#fff';

      dot.style.backgroundColor = colors[color] || colors.yellow;
      statusText.innerText = text === 'ONLINE' ? 'Conectado' : text;
      statusText.style.color = colors[color] || colors.yellow;
    }

    function isSecureEnoughForMedia() {
      return window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    }

    function getCurrentAudioTrack() { return localStream?.getAudioTracks()?.[0] || null; }
    function getCurrentVideoTrack() { return localStream?.getVideoTracks()?.[0] || null; }

    function updateGridLayout() {
      const grid = document.getElementById('videos-grid');
      if (!grid) return;
      const hasPinned = grid.querySelector('.video-pinned');
      
      if (hasPinned) {
        grid.classList.add('has-pinned');
        grid.classList.remove('auto-rows-fr');
      } else {
        grid.classList.remove('has-pinned');
        grid.classList.add('auto-rows-fr');
      }
    }

    // =========================
    // Modal de Entrada (Firebase)
    // =========================
    const tabJoin = document.getElementById('tab-join');
    const tabCreate = document.getElementById('tab-create');
    const boxToken = document.getElementById('box-token');
    const boxCreate = document.getElementById('box-create');
    const btnAction = document.getElementById('btn-action');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    let isCreateMode = false;

    function generateToken() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let token = '';
      for(let i=0; i<4; i++) token += chars.charAt(Math.floor(Math.random() * chars.length));
      token += '-';
      for(let i=0; i<4; i++) token += chars.charAt(Math.floor(Math.random() * chars.length));
      return token;
    }

    tabJoin.onclick = () => {
       isCreateMode = false;
       tabJoin.className = "flex-1 py-2 text-sm font-bold text-white bg-[#5865f2] rounded-md transition-all shadow";
       tabCreate.className = "flex-1 py-2 text-sm font-bold text-[#949ba4] hover:text-white transition-all";
       boxToken.classList.remove('hidden');
       boxCreate.classList.add('hidden');
       btnAction.innerText = "Conectar à Call";
       btnAction.className = "w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold py-3.5 rounded-lg text-sm transition-all mt-6 shadow-lg glow-hover scale-100 hover:scale-[1.02]";
       modalTitle.innerText = "Entrar no QG";
       modalDesc.innerText = "Use o Token de convite para conectar à call.";
    };

    tabCreate.onclick = () => {

             throw new Error(`Servidor não encontrado. O token "${roomToken}" é inválido.`);

        // Definir estado global
        myProfile.name = usernameInput;

        document.getElementById('join-modal').classList.add('hidden');

    // =========================
    // Câmera + microfone
    // =========================
    async function requestCameraAndMicrophone() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        isVideoOff = false; isMuted = false;
        updateMicButton(); updateCameraButton();
      } catch (cameraError) {
        console.warn('Câmera + microfone falharam:', cameraError);
        localStream = await navigator.mediaDevices.getUserMedia({
          video: false,
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        isVideoOff = true;
        updateMicButton(); updateCameraButton();
      }
    }

    async function enableCamera() {
      if (!localStream) return;
      const existingVideo = getCurrentVideoTrack();
      if (existingVideo) {
        existingVideo.enabled = true;
        isVideoOff = false;
        updateCameraButton();
        return;
      }
      try {
        const cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
        const newVideoTrack = cameraStream.getVideoTracks()[0];
        if (!newVideoTrack) throw new Error('Nenhuma câmera encontrada.');
        localStream.addTrack(newVideoTrack);
        if (!isSharing) {
          activeStream = localStream;
          const localVideo = document.getElementById('video-local-video');
          if (localVideo) {
            localVideo.srcObject = localStream;
            localVideo.classList.add('transform', 'scale-x-[-1]');
          }
          await replaceOutgoingTrack('video', newVideoTrack);
        }
        isVideoOff = false;
        updateCameraButton();
      } catch (err) {
        console.error('Erro ao ligar câmera:', err);
        alert('Não foi possível ligar a câmera.');
      }
    }

    async function disableCamera() {
      if (!localStream) return;
      const track = getCurrentVideoTrack();
      if (track) {
        track.enabled = false;
        isVideoOff = true;
        updateCameraButton();
      }
    }

    // =========================
    // PeerJS / WebRTC
    // =========================
    function initPeerConnection() {
      setStatus('CONECTANDO', 'yellow');
      peer = new Peer({
        debug: 1,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
      });
      peer.on('open', (id) => {
        myPeerId = id;
        setStatus('ONLINE', 'green');
        initMqttSignaling(id); // Ainda usamos MQTT só para descobrir quem está na sala
      });
      peer.on('call', (call) => {
        if (calls[call.peer]) return;
        const incomingProfile = call.metadata?.profile || { name: 'Amigo', avatar: null };
        remoteProfiles[call.peer] = incomingProfile;
        calls[call.peer] = call;
        call.answer(activeStream || localStream);
        call.on('stream', (remoteStream) => { addOrUpdateRemoteStream(call.peer, remoteStream, incomingProfile); });
        call.on('close', () => { removeVideoStream(call.peer); });
        call.on('error', (err) => { removeVideoStream(call.peer); });
      });
      peer.on('error', (err) => {
        console.error('PeerJS error:', err);
        setStatus('ERRO P2P', 'red');
      });
      peer.on('disconnected', () => {
        setStatus('RECONHECTANDO', 'yellow');
        try { peer.reconnect(); } catch (e) {}
      });
      peer.on('close', () => { setStatus('OFFLINE', 'red'); });
    }

    function connectToPeer(remotePeerId, remoteProfile) {
      if (!peer || !activeStream || remotePeerId === myPeerId || calls[remotePeerId]) return;
      
      const call = peer.call(remotePeerId, activeStream, { metadata: { profile: myProfile } });
      if (!call) return;
      
      calls[remotePeerId] = call;
      call.on('stream', (remoteStream) => { addOrUpdateRemoteStream(remotePeerId, remoteStream, remoteProfile); });
      call.on('close', () => { removeVideoStream(remotePeerId); });
      call.on('error', (err) => { removeVideoStream(remotePeerId); });
    }

    function reconnectAllPeers() {
      const currentPeers = Object.keys(calls);
      for (const peerId of currentPeers) {
        removeVideoStream(peerId);
        setTimeout(() => { connectToPeer(peerId, remoteProfiles[peerId]); }, 1500); 
      }
    }

    // =========================
    // MQTT (Apenas para Sinalização/Presença WebRTC)
    // =========================
    function initMqttSignaling(myId) {
      const roomTopic = `iagocord/rooms/${currentRoomToken}`;
      try {
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'iagocord_' + Math.random().toString(16).slice(2) + '_' + Date.now(),
          clean: true, reconnectPeriod: 3000, connectTimeout: 10000, keepalive: 30
        });
      } catch (err) {
        setStatus('ERRO CHAT', 'red'); return;
      }

      mqttClient.on('connect', () => {
        mqttConnected = true;
        setStatus('ONLINE', 'green');
        mqttClient.subscribe(roomTopic, { qos: 0 }, (err) => {
          if (!err) mqttClient.publish(roomTopic, JSON.stringify({ type: 'join', peerId: myId, profile: myProfile }));
        });
      });
      mqttClient.on('reconnect', () => { mqttConnected = false; setStatus('RECONNECT CHAT', 'yellow'); });
      mqttClient.on('offline', () => { mqttConnected = false; setStatus('CHAT OFFLINE', 'red'); });
      
      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data.peerId === myId) return;

          if (data.type === 'join') {
            remoteProfiles[data.peerId] = data.profile;
            connectToPeer(data.peerId, data.profile);
            if (isSharing) {
               mqttClient.publish(roomTopic, JSON.stringify({ type: 'screen-share-start', peerId: myPeerId }));
            }
          }
          else if (data.type === 'leave') {
            removeVideoStream(data.peerId);
            delete remoteProfiles[data.peerId];
            activeScreenShares.delete(data.peerId);
          }
          // Nota: O Chat foi removido do MQTT! Agora é Firebase puro.
          else if (data.type === 'screen-share-start') {
            activeScreenShares.add(data.peerId);
            const container = document.getElementById(`container-${data.peerId}`);
            if (container) {
              container.classList.add('video-pinned');
              updateGridLayout();
              const video = document.getElementById(`video-${data.peerId}`);
              if (video) { video.classList.remove('object-cover'); video.classList.add('object-contain', 'bg-black'); }
            }
          }
          else if (data.type === 'screen-share-stop') {
            activeScreenShares.delete(data.peerId);
            const container = document.getElementById(`container-${data.peerId}`);
            if (container) {
              container.classList.remove('video-pinned');
              updateGridLayout();
              const video = document.getElementById(`video-${data.peerId}`);
              if (video) { video.classList.add('object-cover'); video.classList.remove('object-contain', 'bg-black'); }
            }
          }
        } catch (err) {}
      });

      window.addEventListener('beforeunload', () => {
        if (mqttClient && mqttConnected) {
          mqttClient.publish(roomTopic, JSON.stringify({ type: 'leave', peerId: myId }));
        }
      });
    }

    // =========================
    // Firebase: Chat Persistente
    // =========================
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');

    function initFirestoreChat() {
      const messagesRef = collection(db, "rooms", currentRoomToken, "messages");
      const q = query(messagesRef, orderBy("timestamp", "asc"));
      
      // Listener em tempo real do Firebase
      onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added") {
             const data = change.doc.data();
             const isMe = data.peerId === myPeerId;
             
             // O Firebase as vezes envia timestamp null localmente antes de sincronizar, usar Date() fallback
             const timeDate = data.timestamp ? data.timestamp.toDate() : new Date();
             
             appendChatMessage(data.profile, data.text, timeDate, isMe);
          }
        });
      });
    }

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text || !currentRoomToken || !myPeerId) return;

      const messagesRef = collection(db, "rooms", currentRoomToken, "messages");
      
      addDoc(messagesRef, {
         text: text,
         peerId: myPeerId,
         profile: myProfile,
         timestamp: serverTimestamp() // Salva o tempo exato no servidor do Firebase
      }).catch(err => {
         console.error("Erro ao enviar mensagem para o Firebase:", err);
         alert("Erro ao enviar mensagem.");
      });

      chatInput.value = '';
    }

    document.getElementById('btn-send-msg').addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendChatMessage(); }
    });

    function appendChatMessage(profile, text, dateObj, isMe) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex gap-3 hover:bg-[#35373c] group transition-colors rounded-xl p-2 -mx-2';
      
      const avatar = profile?.avatar ? escapeAttribute(profile.avatar) : null;
      const safeName = escapeHtml(profile?.name || 'Usuário');
      const safeText = escapeHtml(text || '');

      const avatarHtml = avatar
        ? `<img src="${avatar}" class="w-10 h-10 rounded-full mt-0.5 object-cover flex-shrink-0 shadow-sm border border-[#1e1f22]" />`
        : `<div class="w-10 h-10 rounded-full mt-0.5 bg-gradient-to-br from-[#5865f2] to-[#3f49b5] flex items-center justify-center text-white font-bold flex-shrink-0 shadow-sm border border-[#1e1f22]">${safeName.charAt(0).toUpperCase()}</div>`;

      const time = dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const formattedText = safeText.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-[#00a8fc] hover:underline">$1</a>');

      msgDiv.innerHTML = `
        ${avatarHtml}
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2 mb-0.5">
            <span class="font-extrabold text-[13px] ${isMe ? 'text-[#23a55a]' : 'text-white'}">${safeName}</span>
            <span class="text-[10px] text-[#949ba4] font-medium">${time}</span>
          </div>
          <div class="text-[13px] text-[#dbdee1] break-words whitespace-pre-wrap leading-relaxed">${formattedText}</div>
        </div>
      `;

      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (!isMe && !isChatOpen) {
        const btn = document.getElementById('btn-toggle-chat');
        btn.classList.add('bg-[#5865f2]', 'animate-pulse');
        setTimeout(() => { btn.classList.remove('bg-[#5865f2]', 'animate-pulse'); }, 3000);
      }
    }

    function removeVideoStream(id) {
      const elem = document.getElementById(`container-${id}`);
      if (elem) {
        const video = elem.querySelector('video');
        if (video) { try { video.pause(); video.srcObject = null; } catch (e) {} }
        elem.remove();
        updateGridLayout();
      }
      if (calls[id]) { try { calls[id].close(); } catch (e) {} delete calls[id]; }
    }

    // =========================
    // Troca de tracks WebRTC
    // =========================
    async function replaceOutgoingTrack(kind, newTrack) {
      let requiresReconnect = false;
      for (const id in calls) {
        const call = calls[id];
        try {
          const pc = call.peerConnection;
          if (!pc) continue;
          const sender = pc.getSenders().find(s => s.track && s.track.kind === kind);
          if (sender) {
            if (newTrack) { await sender.replaceTrack(newTrack); }
          } else {
             if (newTrack) requiresReconnect = true;
          }
        } catch (err) {}
      }
      if (requiresReconnect) reconnectAllPeers();
    }

    // =========================
    // Compartilhamento de tela
    // =========================
    async function startScreenShare(gamerMode = false) {
      if (!localStream) { alert('Entre na sala primeiro.'); return; }
      if (isSharing) { stopScreenShare(); return; }

      try {
        const displayMediaOptions = gamerMode
          ? { video: { frameRate: { ideal: 60, max: 60 }, displaySurface: 'monitor' }, audio: true }
          : { video: true, audio: true };

        screenStream = await navigator.mediaDevices.getDisplayMedia(displayMediaOptions);
        const screenVideoTrack = screenStream.getVideoTracks()[0];
        if (!screenVideoTrack) throw new Error('O navegador não forneceu a tela.');

        const screenAudioTrack = screenStream.getAudioTracks()[0];
        const micTrack = getCurrentAudioTrack();
        const tracksToSend = [screenVideoTrack];

        if (screenAudioTrack) tracksToSend.push(screenAudioTrack);
        else if (micTrack) tracksToSend.push(micTrack);

        const mixedStream = new MediaStream(tracksToSend);
        activeStream = mixedStream;
        isSharing = true;

        const myVideo = document.getElementById('video-local-video');
        const myContainer = document.getElementById('container-local-video');

        if (myVideo) {
          myVideo.srcObject = mixedStream;
          myVideo.classList.remove('transform', 'scale-x-[-1]', 'object-cover');
          myVideo.classList.add('object-contain', 'bg-black');
          myVideo.play().catch(() => {});
        }
        
        if (myContainer) { myContainer.classList.add('video-pinned'); updateGridLayout(); }

        await replaceOutgoingTrack('video', screenVideoTrack);
        await replaceOutgoingTrack('audio', screenAudioTrack || micTrack);
        updateScreenButtons(gamerMode);
        
        if (mqttClient && mqttConnected) {
          mqttClient.publish(`iagocord/rooms/${currentRoomToken}`, JSON.stringify({ type: 'screen-share-start', peerId: myPeerId }));
        }

        screenVideoTrack.onended = () => { if (isSharing) stopScreenShare(); };

      } catch (err) {
        if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
      }
    }

    async function stopScreenShare() {
      if (!isSharing || !localStream) return;

      const cameraTrack = getCurrentVideoTrack();
      const micTrack = getCurrentAudioTrack();
      activeStream = localStream;
      isSharing = false;

      if (cameraTrack) await replaceOutgoingTrack('video', cameraTrack);
      if (micTrack) await replaceOutgoingTrack('audio', micTrack);

      const myVideo = document.getElementById('video-local-video');
      const myContainer = document.getElementById('container-local-video');

      if (myVideo) {
        myVideo.srcObject = localStream;
        myVideo.classList.add('transform', 'scale-x-[-1]', 'object-cover');
        myVideo.classList.remove('object-contain', 'bg-black');
        myVideo.play().catch(() => {});
      }
      if (myContainer) { myContainer.classList.remove('video-pinned'); updateGridLayout(); }

      if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }

      updateScreenButtons(false);
      updateCameraButton();
      
      if (mqttClient && mqttConnected) {
        mqttClient.publish(`iagocord/rooms/${currentRoomToken}`, JSON.stringify({ type: 'screen-share-stop', peerId: myPeerId }));
      }
    }

    function updateScreenButtons(gamerMode) {
      const screenBtn = document.getElementById('ctrl-screen');
      const gamerBtn = document.getElementById('ctrl-gamer');

      if (isSharing) {
        screenBtn.classList.add('bg-[#23a55a]'); screenBtn.classList.remove('bg-[#2b2d31]');
        if (gamerMode) gamerBtn.classList.add('ring-4', 'ring-[#b05cff]', 'bg-white', 'text-[#b05cff]');
      } else {
        screenBtn.classList.remove('bg-[#23a55a]'); screenBtn.classList.add('bg-[#2b2d31]');
        gamerBtn.classList.remove('ring-4', 'ring-[#b05cff]', 'bg-white', 'text-[#b05cff]');
      }
    }

    document.getElementById('ctrl-screen').addEventListener('click', () => { startScreenShare(false); });
    document.getElementById('ctrl-gamer').addEventListener('click', () => { startScreenShare(true); });

    // =========================
    // Volume / speaking indicator
    // =========================
    function setupAudioVolumeDetection(stream, id) {
      try {
        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audioCtx = new AudioContext();
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const mediaStream = new MediaStream([audioTrack]);
        const source = audioCtx.createMediaStreamSource(mediaStream);
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        const checkVolume = () => {
          const container = document.getElementById(`container-${id}`);
          if (!container) { try { audioCtx.close(); } catch (e) {} return; }
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          if (sum / dataArray.length > 22) container.classList.add('speaking');
          else container.classList.remove('speaking');
          requestAnimationFrame(checkVolume);
        };
        checkVolume();
      } catch (err) {}
    }

    // =========================
    // Copiar convite (Atualizado para Token)
    // =========================
    document.getElementById('btn-copy-link').addEventListener('click', async () => {
        if (!currentRoomToken) {
           alert("Você precisa estar em um servidor para convidar.");
           return;
        }

        const link = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(currentRoomToken)}`;
        const msg = `Vem pro meu servidor no iagocord!\n\nNome: ${currentRoomName}\nToken: ${currentRoomToken}\n\nLink direto:\n${link}`;

        try {
          await navigator.clipboard.writeText(msg);
        } catch (err) {
          const temp = document.createElement('textarea');
          temp.value = msg;
          document.body.appendChild(temp); temp.select();
          try { document.execCommand('copy'); } catch (e) {} temp.remove();
        }

        const span = document.querySelector('#btn-copy-link span');
        const icon = document.querySelector('#btn-copy-link i');

        if (span) {
          const originalText = span.innerText;
          span.innerText = 'Copiado!';
          if (icon) { icon.setAttribute('data-lucide', 'check'); lucide.createIcons(); }
          setTimeout(() => {
            span.innerText = originalText;
            if (icon) { icon.setAttribute('data-lucide', 'user-plus'); lucide.createIcons(); }
          }, 3000);
        }
      });

    // =========================
    // Sair
    // =========================
    document.getElementById('ctrl-leave').addEventListener('click', () => {
        if (!confirm('Deseja realmente sair da call?')) return;
        try {
          if (localStream) localStream.getTracks().forEach(t => t.stop());
          if (screenStream) screenStream.getTracks().forEach(t => t.stop());
          for (const id in calls) { try { calls[id].close(); } catch (e) {} }
          if (mqttClient && mqttConnected && peer) {
            mqttClient.publish(`iagocord/rooms/${currentRoomToken}`, JSON.stringify({ type: 'leave', peerId: peer.id }));
            mqttClient.end();
          }
          if (peer) peer.destroy();
        } catch (e) {}
        location.reload();
      });

    // =========================
    // Segurança básica para texto
    // =========================
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function escapeAttribute(value) { return escapeHtml(value); }

    console.log('%ciagocord carregado com Firebase.', 'color:#5865f2;font-weight:bold;');
  </script>
</body>
