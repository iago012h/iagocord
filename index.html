<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iagocord - Premium Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS e MQTT para conexão P2P sem backend próprio -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --discord-darkest: #111214;
      --discord-sidebar: #1e1f22;
      --discord-main: #2b2d31;
      --discord-blurple: #5865f2;
      --discord-green: #23a55a;
      --discord-red: #da373a;
      --neon-gamer: #b05cff;
    }
    
    body {
      background-color: var(--discord-main);
      color: #dbdee1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .bg-grid-pattern {
      background-image: 
        linear-gradient(to right, #1e1f22 1px, transparent 1px),
        linear-gradient(to bottom, #1e1f22 1px, transparent 1px);
      background-size: 40px 40px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #111214; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #5865f2; }

    .speaking {
      border: 3px solid var(--discord-green) !important;
      box-shadow: 0 0 20px rgba(35, 165, 90, 0.4);
      transform: scale(1.01);
      transition: all 0.2s ease-out;
    }
    
    .video-card {
      transition: all 0.3s ease;
      background: linear-gradient(145deg, #1e1f22, #2b2d31);
    }
    .video-card:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Modo de tela cheia/fixada */
    .video-pinned {
      grid-column: 1 / -1 !important;
      min-h: 60vh !important;
      z-index: 10;
    }
    
    .glow-hover:hover {
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.6);
    }
    .glow-gamer:hover {
      box-shadow: 0 0 20px rgba(176, 92, 255, 0.8);
    }
  </style>
</head>
<body class="h-screen flex overflow-hidden select-none bg-grid-pattern">

  <!-- 1. Barra Lateral de Servidores -->
  <aside class="w-[72px] bg-[var(--discord-darkest)] flex flex-col items-center py-4 gap-3 flex-shrink-0 z-20 hidden md:flex shadow-2xl">
    <div class="w-12 h-12 bg-gradient-to-br from-[#5865f2] to-[#7983f5] rounded-2xl flex items-center justify-center text-white font-bold text-2xl cursor-pointer hover:rounded-xl hover:scale-105 transition-all shadow-[0_0_15px_rgba(88,101,242,0.5)]">
      <i>i</i>
    </div>
    <div class="w-8 h-[2px] bg-[#35363c] rounded my-1"></div>
    <div title="Recarregar Chamada" onclick="location.reload()" class="w-12 h-12 bg-[#2b2d31] hover:bg-[#23a55a] text-[#23a55a] hover:text-white rounded-full hover:rounded-2xl flex items-center justify-center cursor-pointer transition-all">
      <i data-lucide="refresh-cw" class="w-5 h-5"></i>
    </div>
  </aside>

  <!-- 2. Barra de Canais -->
  <aside id="sidebar-channels" class="w-full md:w-64 bg-[var(--discord-sidebar)] flex flex-col justify-between flex-shrink-0 border-r border-[#111214] absolute md:relative z-10 h-full transition-transform duration-300">
    <div>
      <div class="h-14 px-4 flex items-center justify-between font-extrabold text-white shadow-md bg-gradient-to-r from-[#1e1f22] to-[#2b2d31]">
        <span class="truncate tracking-wide">IAGOCORD PREMIUM</span>
        <button id="btn-close-sidebar" class="md:hidden p-1 hover:bg-[#35373c] rounded text-gray-400">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-3 space-y-2 mt-2">
        <div class="text-[11px] font-bold text-[#949ba4] px-2 tracking-widest uppercase">Canais de Voz</div>
        <div class="flex items-center gap-2 px-2 py-2 rounded bg-gradient-to-r from-[#35373c] to-transparent text-white cursor-pointer border-l-2 border-[#5865f2]">
          <i data-lucide="volume-2" class="w-4 h-4 text-gray-300"></i>
          <span class="text-sm font-semibold" id="channel-name-display">QG Geral</span>
          <span id="badge-status" class="ml-auto text-[9px] bg-yellow-500 text-black px-2 py-0.5 rounded-full font-bold shadow-[0_0_5px_#eab308]">CONECTANDO</span>
        </div>
      </div>
    </div>

    <!-- Perfil Inferior -->
    <div class="h-16 bg-[#111214] px-3 flex items-center justify-between shadow-[0_-5px_10px_rgba(0,0,0,0.2)]">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="relative flex-shrink-0">
          <img id="avatar-img-preview" src="" class="w-9 h-9 rounded-full hidden object-cover border-2 border-[#2b2d31]" />
          <div id="avatar-initial-container" class="w-9 h-9 rounded-full bg-gradient-to-br from-[#5865f2] to-[#3f49b5] flex items-center justify-center text-white font-bold text-sm shadow-md">
            <span id="avatar-initial">U</span>
          </div>
          <div id="status-indicator-dot" class="w-3.5 h-3.5 bg-yellow-500 rounded-full border-2 border-[#111214] absolute -bottom-0.5 -right-0.5 transition-colors"></div>
        </div>
        <div class="leading-tight overflow-hidden">
          <div id="display-username" class="text-sm font-bold text-white truncate w-24">Você</div>
          <div id="display-status-text" class="text-[11px] text-yellow-500 font-medium truncate">Aguardando entrada</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 3. Área Principal -->
  <main class="flex-1 flex flex-col relative overflow-hidden w-full bg-transparent">
    <!-- Topbar -->
    <header class="h-14 border-b border-[#1e1f22] px-3 md:px-5 flex items-center justify-between bg-[var(--discord-main)]/90 backdrop-blur-sm shadow-sm shrink-0 z-10">
      <div class="flex items-center gap-3">
        <button id="btn-open-sidebar" class="md:hidden p-1.5 hover:bg-[#35373c] rounded text-gray-400">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <div class="p-1.5 bg-[#1e1f22] rounded-lg hidden md:block">
            <i data-lucide="hash" class="w-5 h-5 text-gray-400"></i>
        </div>
        <span class="font-bold text-white text-[15px] truncate max-w-[150px] md:max-w-xs" id="room-title">Canal: Carregando...</span>
      </div>
      <div class="flex gap-3">
          <button id="btn-toggle-chat" class="flex items-center justify-center px-3 py-1.5 bg-[#1e1f22] hover:bg-[#35373c] text-white text-xs font-bold rounded-lg transition shadow-md">
              <i data-lucide="message-square" class="w-4 h-4 md:mr-1.5 text-[#5865f2]"></i>
              <span class="hidden md:inline">Chat</span>
          </button>
          <button id="btn-copy-link" class="flex items-center justify-center px-3 py-1.5 bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold rounded-lg transition shadow-md glow-hover">
            <i data-lucide="user-plus" class="w-4 h-4 md:mr-1.5"></i>
            <span class="hidden md:inline">Convidar Amigos</span>
          </button>
      </div>
    </header>

    <!-- Modal Inicial -->
    <div id="join-modal" class="absolute inset-0 bg-black/80 backdrop-blur-lg z-40 flex items-center justify-center p-4">
      <div class="bg-[var(--discord-main)] border border-[#1e1f22] w-full max-w-md p-8 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.5)] text-center flex flex-col">
        <div class="w-16 h-16 bg-gradient-to-br from-[#5865f2] to-[#7983f5] rounded-3xl mx-auto flex items-center justify-center text-white mb-4 shadow-[0_0_20px_rgba(88,101,242,0.4)] transform -rotate-6">
          <i data-lucide="headset" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-white mb-1">Entrar no QG</h2>
        <p class="text-sm text-[#949ba4] mb-6 font-medium">Configure seu nick e entre na call com a galera.</p>

        <div class="space-y-4 text-left">
          <div>
            <label class="text-xs font-bold text-[#b5bac1] uppercase tracking-wider block mb-1.5">Seu Nickname *</label>
            <input id="input-username" type="text" placeholder="Ex: Iago" class="w-full bg-[#1e1f22] border-2 border-[#111214] text-white rounded-lg p-3 text-sm focus:outline-none focus:border-[#5865f2] transition-colors" />
          </div>
          <div>
            <label class="text-xs font-bold text-[#b5bac1] uppercase tracking-wider block mb-1.5">URL do Avatar (Opcional)</label>
            <input id="input-avatar" type="text" placeholder="Link da imagem..." class="w-full bg-[#1e1f22] border-2 border-[#111214] text-white rounded-lg p-3 text-sm focus:outline-none focus:border-[#5865f2] transition-colors" />
          </div>
          <div>
            <label class="text-xs font-bold text-[#b5bac1] uppercase tracking-wider block mb-1.5">Nome / ID da Sala *</label>
            <input id="input-room" type="text" placeholder="Ex: resenha" class="w-full bg-[#1e1f22] border-2 border-[#111214] text-white rounded-lg p-3 text-sm focus:outline-none focus:border-[#5865f2] transition-colors" />
          </div>
          <button id="btn-join" class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold py-3.5 rounded-lg text-sm transition-all mt-6 shadow-lg glow-hover scale-100 hover:scale-[1.02]">
            Conectar à Call
          </button>
        </div>
      </div>
    </div>

    <!-- Área de Conteúdo (Vídeos + Chat) -->
    <div class="flex-1 flex overflow-hidden w-full relative">
        <!-- Grid dos Vídeos -->
        <div id="videos-grid" class="flex-1 p-3 md:p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 overflow-y-auto auto-rows-fr transition-all duration-300">
          <!-- Cards de vídeo inseridos dinamicamente -->
        </div>

        <!-- Chat Lateral -->
        <aside id="chat-panel" class="w-full sm:w-80 bg-[var(--discord-sidebar)] border-l border-[#111214] flex flex-col h-full transform translate-x-full transition-transform duration-300 absolute right-0 z-20 sm:relative sm:translate-x-0 hidden shadow-2xl">
            <div class="h-14 border-b border-[#111214] px-4 flex items-center justify-between shrink-0 bg-[#2b2d31]">
                <div class="flex items-center gap-2 text-white font-bold text-sm tracking-wide">
                    <i data-lucide="hash" class="w-5 h-5 text-[#949ba4]"></i>
                    bate-papo
                </div>
                <button id="btn-close-chat" class="p-1.5 hover:bg-[#35373c] rounded-md text-gray-400 sm:hidden transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-5">
                <div class="text-center bg-[#1e1f22] p-4 rounded-xl border border-[#35373c] mt-2">
                    <h3 class="text-white font-bold text-sm mb-1">Bem-vindo ao Chat!</h3>
                    <p class="text-xs text-gray-400">As mensagens enviadas aqui somem quando a call termina.</p>
                </div>
            </div>

            <div class="p-4 bg-[#2b2d31] shrink-0 border-t border-[#1e1f22]">
                <div class="relative bg-[#383a40] rounded-xl p-1 flex items-center shadow-inner">
                    <input id="chat-input" type="text" placeholder="Conversar na sala..." class="flex-1 bg-transparent border-none text-sm text-white focus:outline-none px-3 py-2 placeholder-[#949ba4]" />
                    <button id="btn-send-msg" class="p-2 text-[#5865f2] hover:text-[#7983f5] transition bg-[#2b2d31] rounded-lg shadow-sm mr-1">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Barra de Controles Inferior -->
    <footer class="h-24 bg-[var(--discord-darkest)] flex flex-col md:flex-row items-center justify-center md:justify-between px-6 shrink-0 z-10 relative border-t border-[#1e1f22]">
      
      <div class="hidden md:flex w-1/3 items-center text-[#949ba4] text-xs font-semibold gap-2">
        <i data-lucide="shield-check" class="w-4 h-4 text-[#23a55a]"></i>
        Conexão P2P Aberta
      </div>

      <!-- Controles Centrais -->
      <div class="flex items-center gap-3 md:gap-5 w-full md:w-1/3 justify-center">
        <!-- Mic -->
        <button id="ctrl-mic" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#2b2d31] hover:bg-[#35373c] text-white flex items-center justify-center transition-all shadow-lg hover:shadow-xl group">
          <i data-lucide="mic" id="main-mic-icon" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>

        <!-- Cam -->
        <button id="ctrl-cam" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#2b2d31] hover:bg-[#35373c] text-white flex items-center justify-center transition-all shadow-lg hover:shadow-xl group">
          <i data-lucide="video" id="main-video-icon" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>

        <!-- Screen Share Normal -->
        <button id="ctrl-screen" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#2b2d31] hover:bg-[#5865f2] text-white hidden sm:flex items-center justify-center transition-all shadow-lg hover:shadow-xl group" title="Compartilhar Tela (Básico)">
          <i data-lucide="monitor-up" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>

        <!-- Screen Share GAMER -->
        <button id="ctrl-gamer" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-gradient-to-br from-[#8a2be2] to-[#b05cff] text-white hidden sm:flex items-center justify-center transition-all shadow-[0_0_15px_rgba(176,92,255,0.4)] glow-gamer group" title="Modo Gamer (60 FPS + Áudio Puro)">
          <i data-lucide="gamepad-2" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>

        <!-- Leave -->
        <div class="w-px h-8 bg-[#35373c] mx-1"></div>
        <button id="ctrl-leave" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-[#da373a] hover:bg-[#c92b2d] text-white flex items-center justify-center transition-all shadow-[0_0_15px_rgba(218,55,58,0.4)] group">
          <i data-lucide="phone-off" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
        </button>
      </div>

      <div class="hidden md:flex w-1/3 justify-end text-[#949ba4] text-xs font-bold items-center gap-2">
        Online via WebRTC
        <i data-lucide="zap" class="w-4 h-4 text-[#eebb19]"></i>
      </div>
    </footer>
  </main>

  <script>
    lucide.createIcons();

    let localStream = null;
    let screenStream = null;
    let peer = null;
    let mqttClient = null;
    let currentRoom = null;
    let myProfile = { name: 'Usuário', avatar: null };
    const calls = {};
    const connections = {};
    let isSharing = false;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('room')) document.getElementById('input-room').value = urlParams.get('room');

    const sidebarChannels = document.getElementById('sidebar-channels');
    document.getElementById('btn-open-sidebar').addEventListener('click', () => {
        sidebarChannels.classList.remove('-translate-x-full');
        sidebarChannels.classList.add('translate-x-0', 'absolute');
    });
    document.getElementById('btn-close-sidebar').addEventListener('click', () => {
        sidebarChannels.classList.add('-translate-x-full');
        sidebarChannels.classList.remove('translate-x-0');
    });
    if (window.innerWidth < 768) sidebarChannels.classList.add('-translate-x-full');

    const chatPanel = document.getElementById('chat-panel');
    let isChatOpen = false;
    function toggleChat() {
        isChatOpen = !isChatOpen;
        if (isChatOpen) {
            chatPanel.classList.remove('hidden');
            setTimeout(() => chatPanel.classList.remove('translate-x-full'), 10);
        } else {
            chatPanel.classList.add('translate-x-full');
            setTimeout(() => chatPanel.classList.add('hidden'), 300);
        }
    }
    document.getElementById('btn-toggle-chat').addEventListener('click', toggleChat);
    document.getElementById('btn-close-chat').addEventListener('click', toggleChat);

    document.getElementById('btn-join').addEventListener('click', async () => {
      const usernameInput = document.getElementById('input-username').value.trim();
      const roomInput = document.getElementById('input-room').value.trim();
      const avatarInput = document.getElementById('input-avatar').value.trim();

      if (!usernameInput || !roomInput) return alert('Preencha seu nome e a sala!');

      myProfile.name = usernameInput;
      myProfile.avatar = avatarInput !== "" ? avatarInput : null;
      currentRoom = roomInput.toLowerCase().replace(/[^a-z0-9_-]/g, '');
      
      document.getElementById('display-username').innerText = myProfile.name;
      if (myProfile.avatar) {
          document.getElementById('avatar-img-preview').src = myProfile.avatar;
          document.getElementById('avatar-img-preview').classList.remove('hidden');
          document.getElementById('avatar-initial-container').classList.add('hidden');
      } else {
          document.getElementById('avatar-initial').innerText = myProfile.name.charAt(0).toUpperCase();
      }
      
      document.getElementById('room-title').innerText = `Canal: #${currentRoom}`;
      document.getElementById('channel-name-display').innerText = `#${currentRoom}`;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, 
            audio: { echoCancellation: true, noiseSuppression: true } 
        });
      } catch (err) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
        } catch (e) {
          alert('Não foi possível acessar seu microfone/câmera.');
          return;
        }
      }

      addVideoStream('local-video', localStream, myProfile, true);
      document.getElementById('join-modal').classList.add('hidden');
      initPeerConnection();
      setupAudioVolumeDetection(localStream, 'local-video');
    });

    function initPeerConnection() {
      // Deixa o servidor criar um ID seguro automaticamente
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        const badge = document.getElementById('badge-status');
        badge.innerText = 'ONLINE';
        badge.className = 'ml-auto text-[9px] bg-[#23a55a] text-white px-2 py-0.5 rounded-full font-bold shadow-[0_0_5px_#23a55a]';
        
        document.getElementById('status-indicator-dot').className = 'w-3.5 h-3.5 bg-[#23a55a] rounded-full border-2 border-[#111214] absolute -bottom-0.5 -right-0.5 shadow-[0_0_5px_#23a55a]';
        document.getElementById('display-status-text').innerText = 'Conectado';
        document.getElementById('display-status-text').className = 'text-[11px] text-[#23a55a] font-medium truncate';

        initMqttSignaling(id);
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        const remoteProfile = call.metadata ? call.metadata.profile : { name: 'Amigo', avatar: null };
        
        call.on('stream', (remoteStream) => {
          if (!document.getElementById(`video-${call.peer}`)) {
              addVideoStream(call.peer, remoteStream, remoteProfile, false);
              setupAudioVolumeDetection(remoteStream, call.peer);
          }
        });
        call.on('close', () => removeVideoStream(call.peer));
        calls[call.peer] = call;
      });

      peer.on('connection', (conn) => setupDataConnection(conn));
    }

    function initMqttSignaling(myId) {
      const roomTopic = `iagocord/rooms/${currentRoom}`;
      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      mqttClient.on('connect', () => {
        mqttClient.subscribe(roomTopic);
        mqttClient.publish(roomTopic, JSON.stringify({ type: 'join', peerId: myId, profile: myProfile }));
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data.peerId !== myId) {
            if (data.type === 'join') {
              connectToPeer(data.peerId, data.profile);
              mqttClient.publish(roomTopic, JSON.stringify({ type: 'present', peerId: myId, profile: myProfile }));
            } else if (data.type === 'present' && !calls[data.peerId]) {
              connectToPeer(data.peerId, data.profile);
            }
          }
        } catch (e) {}
      });
    }

    function connectToPeer(remotePeerId, remoteProfile) {
      if (calls[remotePeerId]) return;
      
      const call = peer.call(remotePeerId, localStream, { metadata: { profile: myProfile } });
      call.on('stream', (remoteStream) => {
         if (!document.getElementById(`video-${remotePeerId}`)) {
             addVideoStream(remotePeerId, remoteStream, remoteProfile, false);
             setupAudioVolumeDetection(remoteStream, remotePeerId);
         }
      });
      call.on('close', () => removeVideoStream(remotePeerId));
      calls[remotePeerId] = call;

      const conn = peer.connect(remotePeerId);
      setupDataConnection(conn);
    }

    function setupDataConnection(conn) {
        conn.on('open', () => connections[conn.peer] = conn);
        conn.on('data', (data) => { 
          if (data.type === 'chat') appendChatMessage(data.profile, data.message, false); 
        });
        conn.on('close', () => delete connections[conn.peer]);
    }

    function addVideoStream(id, stream, profile, isLocal) {
      let card = document.getElementById(`container-${id}`);
      if (!card) {
        card = document.createElement('div');
        card.id = `container-${id}`;
        card.className = "video-card relative rounded-2xl overflow-hidden flex items-center justify-center border border-[#35373c] min-h-[180px] group";

        const video = document.createElement('video');
        video.id = `video-${id}`;
        video.autoplay = true;
        video.playsInline = true;
        if (isLocal) video.muted = true;
        video.srcObject = stream;
        video.className = `w-full h-full object-cover ${(isLocal && !isSharing) ? 'transform scale-x-[-1]' : ''}`;

        const overlay = document.createElement('div');
        overlay.className = "absolute inset-0 pointer-events-none flex flex-col justify-between p-3 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-90";
        
        const tag = document.createElement('div');
        tag.className = "absolute bottom-3 left-3 bg-black/60 backdrop-blur-md pr-4 pl-1.5 py-1.5 rounded-full text-xs font-bold text-white flex items-center gap-2.5 pointer-events-auto border border-white/10";
        
        let avatarHtml = profile.avatar 
            ? `<img src="${profile.avatar}" class="w-7 h-7 rounded-full object-cover border-2 border-[#5865f2]" />`
            : `<div class="w-7 h-7 rounded-full bg-gradient-to-br from-[#5865f2] to-[#3f49b5] flex items-center justify-center text-[11px] shadow-inner">${profile.name.charAt(0).toUpperCase()}</div>`;
        
        tag.innerHTML = `${avatarHtml}<span class="truncate max-w-[120px] drop-shadow-md">${profile.name} ${isLocal ? '(Você)' : ''}</span>`;

        const topActions = document.createElement('div');
        topActions.className = "absolute top-3 right-3 flex items-center gap-2 pointer-events-auto opacity-0 group-hover:opacity-100 transition-all";

        const btnPin = document.createElement('button');
        btnPin.className = "p-2 bg-black/50 hover:bg-[#5865f2] rounded-xl text-white transition-all backdrop-blur-md border border-white/10";
        btnPin.title = "Fixar / Destacar";
        btnPin.innerHTML = `<i data-lucide="maximize-2" class="w-4 h-4"></i>`;
        btnPin.onclick = () => {
          card.classList.toggle('video-pinned');
        };
        topActions.appendChild(btnPin);

        if (!isLocal) {
            const volumeContainer = document.createElement('div');
            volumeContainer.className = "flex items-center gap-1.5 bg-black/60 px-2 py-1.5 rounded-xl border border-white/10 backdrop-blur-md";
            volumeContainer.innerHTML = `
              <i data-lucide="volume-2" class="w-3.5 h-3.5 text-gray-300"></i>
              <input type="range" min="0" max="1" step="0.05" value="1" class="w-16 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-[#5865f2]" />
            `;
            const rangeInput = volumeContainer.querySelector('input');
            rangeInput.oninput = (e) => {
              video.volume = parseFloat(e.target.value);
            };
            topActions.appendChild(volumeContainer);

            const btnMuteRemote = document.createElement('button');
            btnMuteRemote.className = "p-2 bg-black/50 hover:bg-[#da373a] rounded-xl text-white transition-all backdrop-blur-md border border-white/10";
            btnMuteRemote.title = "Mutar participante";
            btnMuteRemote.innerHTML = `<i data-lucide="volume-x" class="w-4 h-4"></i>`;
            let isUserMutedLocally = false;
            btnMuteRemote.onclick = () => {
                isUserMutedLocally = !isUserMutedLocally;
                video.muted = isUserMutedLocally;
                btnMuteRemote.classList.toggle('bg-[#da373a]', isUserMutedLocally);
                btnMuteRemote.classList.toggle('bg-black/50', !isUserMutedLocally);
            };
            topActions.appendChild(btnMuteRemote);
        }

        overlay.appendChild(topActions);
        overlay.appendChild(tag);
        card.appendChild(video);
        card.appendChild(overlay);
        document.getElementById('videos-grid').appendChild(card);
        lucide.createIcons();
      } else {
        document.getElementById(`video-${id}`).srcObject = stream;
      }
    }

    function removeVideoStream(id) {
      const elem = document.getElementById(`container-${id}`);
      if (elem) elem.remove();
      if (calls[id]) delete calls[id];
      if (connections[id]) delete connections[id];
    }

    function setupAudioVolumeDetection(stream, id) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            const audioTrack = stream.getAudioTracks()[0];
            if (!audioTrack) return;
            const mediaStream = new MediaStream([audioTrack]);
            const source = audioCtx.createMediaStreamSource(mediaStream);
            source.connect(analyser);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            const checkVolume = () => {
                if (!document.getElementById(`container-${id}`)) return;
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                if ((sum / dataArray.length) > 22) {
                    document.getElementById(`container-${id}`).classList.add('speaking');
                } else {
                    document.getElementById(`container-${id}`).classList.remove('speaking');
                }
                requestAnimationFrame(checkVolume);
            };
            checkVolume();
        } catch (e) {}
    }

    let isMuted = false;
    document.getElementById('ctrl-mic').addEventListener('click', () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
      const btn = document.getElementById('ctrl-mic');
      const icon = document.getElementById('main-mic-icon');
      if (isMuted) {
        btn.classList.add('bg-[#da373a]', 'hover:bg-[#c92b2d]');
        btn.classList.remove('bg-[#2b2d31]', 'hover:bg-[#35373c]');
        icon.setAttribute('data-lucide', 'mic-off');
      } else {
        btn.classList.remove('bg-[#da373a]', 'hover:bg-[#c92b2d]');
        btn.classList.add('bg-[#2b2d31]', 'hover:bg-[#35373c]');
        icon.setAttribute('data-lucide', 'mic');
      }
      lucide.createIcons();
    });

    let isVideoOff = false;
    document.getElementById('ctrl-cam').addEventListener('click', () => {
      if (!localStream) return;
      isVideoOff = !isVideoOff;
      localStream.getVideoTracks().forEach(track => track.enabled = !isVideoOff);
      const btn = document.getElementById('ctrl-cam');
      const icon = document.getElementById('main-video-icon');
      if (isVideoOff) {
        btn.classList.add('bg-[#da373a]', 'hover:bg-[#c92b2d]');
        btn.classList.remove('bg-[#2b2d31]', 'hover:bg-[#35373c]');
        icon.setAttribute('data-lucide', 'video-off');
      } else {
        btn.classList.remove('bg-[#da373a]', 'hover:bg-[#c92b2d]');
        btn.classList.add('bg-[#2b2d31]', 'hover:bg-[#35373c]');
        icon.setAttribute('data-lucide', 'video');
      }
      lucide.createIcons();
    });

    async function startScreenShare(gamerMode) {
      if (isSharing) return stopScreenShare();
      try {
        const displayMediaOptions = gamerMode ? {
            video: { frameRate: { ideal: 60, max: 60 }, displaySurface: "monitor" },
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        } : { video: true, audio: true };

        screenStream = await navigator.mediaDevices.getDisplayMedia(displayMediaOptions);
        const screenVideoTrack = screenStream.getVideoTracks()[0];
        const screenAudioTrack = screenStream.getAudioTracks()[0];

        const tracksToSend = [screenVideoTrack];
        if (screenAudioTrack) {
            tracksToSend.push(screenAudioTrack);
        } else if (localStream.getAudioTracks()[0]) {
            tracksToSend.push(localStream.getAudioTracks()[0]);
        }

        const mixedStream = new MediaStream(tracksToSend);

        for (let id in calls) {
          const videoSender = calls[id].peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          const audioSender = calls[id].peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
          
          if (videoSender) videoSender.replaceTrack(screenVideoTrack);
          if (audioSender && screenAudioTrack) audioSender.replaceTrack(screenAudioTrack);
        }
        
        const myVideo = document.getElementById('video-local-video');
        myVideo.srcObject = mixedStream;
        myVideo.classList.remove('transform', 'scale-x-[-1]');
        
        isSharing = true;

        if (gamerMode) {
            document.getElementById('ctrl-gamer').classList.add('ring-4', 'ring-[#b05cff]', 'bg-white', 'text-[#b05cff]');
        } else {
            document.getElementById('ctrl-screen').classList.add('bg-[#23a55a]');
            document.getElementById('ctrl-screen').classList.remove('bg-[#2b2d31]');
        }

        screenVideoTrack.onended = () => stopScreenShare();
      } catch (e) {
        console.log('Compartilhamento cancelado.', e);
      }
    }

    function stopScreenShare() {
      if (!isSharing || !localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      const audioTrack = localStream.getAudioTracks()[0];
      
      for (let id in calls) {
        const videoSender = calls[id].peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        const audioSender = calls[id].peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
        if (videoSender) videoSender.replaceTrack(videoTrack);
        if (audioSender && audioTrack) audioSender.replaceTrack(audioTrack);
      }
      
      const myVideo = document.getElementById('video-local-video');
      myVideo.srcObject = localStream;
      myVideo.classList.add('transform', 'scale-x-[-1]');
      
      document.getElementById('ctrl-screen').classList.remove('bg-[#23a55a]');
      document.getElementById('ctrl-screen').classList.add('bg-[#2b2d31]');
      document.getElementById('ctrl-gamer').classList.remove('ring-4', 'ring-[#b05cff]', 'bg-white', 'text-[#b05cff]');
      
      if (screenStream) screenStream.getTracks().forEach(t => t.stop());
      isSharing = false;
    }

    document.getElementById('ctrl-screen').addEventListener('click', () => startScreenShare(false));
    document.getElementById('ctrl-gamer').addEventListener('click', () => startScreenShare(true));

    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');

    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        appendChatMessage(myProfile, text, true);
        for (let peerId in connections) connections[peerId].send({ type: 'chat', profile: myProfile, message: text });
        chatInput.value = '';
    }

    document.getElementById('btn-send-msg').addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

    function appendChatMessage(profile, text, isMe) {
        const msgDiv = document.createElement('div');
        msgDiv.className = "flex gap-3 hover:bg-[#35373c] group transition-colors rounded-xl p-2 -mx-2";
        
        let avatarHtml = profile.avatar 
            ? `<img src="${profile.avatar}" class="w-10 h-10 rounded-full mt-0.5 object-cover flex-shrink-0 shadow-sm border border-[#1e1f22]" />`
            : `<div class="w-10 h-10 rounded-full mt-0.5 bg-gradient-to-br from-[#5865f2] to-[#3f49b5] flex items-center justify-center text-white font-bold flex-shrink-0 shadow-sm border border-[#1e1f22]">${profile.name.charAt(0).toUpperCase()}</div>`;

        const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const formattedText = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="text-[#00a8fc] hover:underline">$1</a>');

        msgDiv.innerHTML = `
            ${avatarHtml}
            <div class="flex-1 min-w-0">
                <div class="flex items-baseline gap-2 mb-0.5">
                    <span class="font-extrabold text-[13px] ${isMe ? 'text-[#23a55a]' : 'text-white'}">${profile.name}</span>
                    <span class="text-[10px] text-[#949ba4] font-medium">${time}</span>
                </div>
                <div class="text-[13px] text-[#dbdee1] break-words whitespace-pre-wrap leading-relaxed">${formattedText}</div>
            </div>
        `;
        
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        if (!isMe && !isChatOpen) {
            const btn = document.getElementById('btn-toggle-chat');
            btn.classList.add('bg-[#5865f2]', 'animate-pulse');
            setTimeout(() => btn.classList.remove('bg-[#5865f2]', 'animate-pulse'), 3000);
        }
    }

    document.getElementById('btn-copy-link').addEventListener('click', () => {
      navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?room=${currentRoom || 'geral'}`);
      const span = document.querySelector('#btn-copy-link span');
      const icon = document.querySelector('#btn-copy-link i');
      const originalText = span.innerText;
      span.innerText = "Copiado!";
      icon.setAttribute('data-lucide', 'check');
      lucide.createIcons();
      setTimeout(() => { span.innerText = originalText; icon.setAttribute('data-lucide', 'user-plus'); lucide.createIcons(); }, 2000);
    });

    document.getElementById('ctrl-leave').addEventListener('click', () => {
      if (confirm('Deseja realmente sair da call?')) {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        if (mqttClient) mqttClient.end();
        location.reload();
      }
    });
      }
    });
  </script>
